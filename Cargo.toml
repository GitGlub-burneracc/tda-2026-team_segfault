[package]
name = "tda"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
ezrustdom = { path = "ezrustdom" }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
serde = "1.0.229"
csv = "1.4.0"

[workspace]
members = ["ezrustdom"]
exclude = ["erd/*"]
