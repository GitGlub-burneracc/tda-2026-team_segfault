[package]
# Metadata for building this page as a WebAssembly package.
name = "erd-page"
version = "0.1.0"
edition = "2024"

[lib]
# Use wasm.rs as the library entry file and emit a browser-loadable WASM module.
path = "wasm.rs"
crate-type = ["cdylib"]

[dependencies]
# wasm-bindgen connects Rust code to JavaScript; web-sys exposes browser APIs.
wasm-bindgen = "0.2"
web-sys = "0.3"
