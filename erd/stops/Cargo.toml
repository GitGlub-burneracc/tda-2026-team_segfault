[package]
name = "stops"
version = "0.1.0"
edition = "2024"

[lib]
path = "wasm.rs"
crate-type = ["cdylib"]

[dependencies]
ezrustdom = { path = "../../ezrustdom" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
gloo-net = "0.7.0"


[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "Response",
]

[workspace]
